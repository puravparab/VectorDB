[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-db"
version = "0.1.0"
description = "A small, dependency-free vector database experiment"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vectordb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
